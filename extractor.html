<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ESPARTA V4 FINAL</title>
<style>body{background:#070f1e;color:white;font-family:Arial;padding:12px}input{width:100%;padding:12px;border-radius:10px;border:none}button{width:100%;background:#00a8ff;color:white;padding:14px;border:none;border-radius:10px;font-weight:bold;margin-top:10px} #out{background:#12233f;padding:10px;margin-top:15px;border-radius:10px;white-space:pre-wrap;word-break:break-all}</style>
</head><body>
<h2>ESPARTA V4 - PRUEBA CON OTRA TIENDA</h2>
<input id="url" value="https://ps4pkg.link/" placeholder="Pega link de otra tienda">
<button onclick="buscar()">BUSCAR JUEGOS</button>
<div id="out">Consejo: dlpsgame está bloqueada. Prueba con: ps4pkg.link / superps4.com / psgamer.fun</div>
<script>
async function buscar(){
let url=document.getElementById('url').value.trim();
let out=document.getElementById('out');
out.innerText='Probando 3 formas de entrar... espera 15 seg...';
let proxies=[
'https://corsproxy.io/?'+encodeURIComponent(url),
'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(url)
];
for(let p of proxies){
try{
let r=await fetch(p);
let html=await r.text();
if(html.length>1000){
let doc=new DOMParser().parseFromString(html,'text/html');
let lista=[];
doc.querySelectorAll('img').forEach(img=>{
let src=img.src||img.dataset.src||'';
if(src.length>20 && !src.includes('logo')){
let title=(img.alt||'Juego PS4').substring(0,40);
lista.push(`IMG: ${src}\nTITLE: ${title}\n---`);
}
});
if(lista.length>0){out.innerText='¡SI ENTRO! Copiado con: '+p+'\n\n'+lista.slice(0,20).join('\n'); return;}
}
}catch(e){}
}
out.innerText='Esa tienda también bloquea. Mándame el link de otra tienda que conozcas y te digo si sirve.';
}
</script></body></html>
