<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>ESPARTA COPIADOR</title><style>body{background:#070f1e;color:#fff;font-family:Arial;padding:12px}textarea{width:100%;height:130px;border-radius:8px;padding:8px}button{background:#00a8ff;color:#fff;border:none;padding:13px;width:100%;border-radius:8px;font-weight:bold}pre{background:#12233f;padding:10px;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-all;margin-top:10px}</style></head><body><h2>ESPARTA COPIADOR</h2><textarea id="a" placeholder="Pega aqui el codigo fuente de otra tienda..."></textarea><button onclick="c()">COPIAR JUEGOS</button><pre id="b"></pre><script>function c(){let h=document.getElementById('a').value,o="",r=/href=["']([^"']+\.pkg)["'][^>]*>([^<]+)?/gi,m;while(m=r.exec(h)){let l=m[1],n=(m[2]||l.split('/').pop()).trim();o+=`<div class="card">\n<img src="https://dummyimage.com/300x400/12233f/00a8ff&text=${encodeURIComponent(n.slice(0,12))}">\n<h3>${n}</h3>\n<a class="btn" href="${l}">Descargar</a>\n</div>\n\n`;}if(!o)o="No encontre .pkg";document.getElementById('b').textContent=o;}</script></body></html>
