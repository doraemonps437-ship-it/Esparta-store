<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESPARTA STORE</title><style>body{background:#0d1117;color:#fff;font-family:Arial;margin:0;padding:10px}h1{text-align:center;color:#ff0000;margin:10px}input{width:100%;padding:12px;border-radius:10px;border:none;background:#161b22;color:#fff;box-sizing:border-box}#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.card{background:#161b22;border-radius:12px;overflow:hidden;text-align:center;padding-bottom:8px}.card img{width:100%;height:185px;object-fit:cover}.card h3{font-size:11px;margin:6px;height:28px;overflow:hidden}.btn{background:#ff0000;color:#fff;padding:6px 12px;border-radius:6px;text-decoration:none;display:inline-block;font-size:12px}#load{text-align:center;padding:30px}</style></head><body><h1>ESPARTA STORE PS4</h1><input id=b placeholder="Buscar juego..." onkeyup="filtrar()"><div id=load>Cargando juegos de SuperPSX...</div><div id=grid></div><script>
async function cargar(){try{let r=await fetch('https://api.allorigins.win/raw?url=https://superpsx.com/category/ps4/');let t=await r.text();let doc=new DOMParser().parseFromString(t,'text/html');let juegos=[];let seen=new Set();doc.querySelectorAll('img').forEach(img=>{let src=img.src||img.getAttribute('src')||'';if(!src.includes('uploads'))return;if(src.toLowerCase().includes('logo'))return;let a=img.closest('a');if(!a)return;let link=a.href;if(!link||seen.has(link))return;if(link.includes('/category/'))return;seen.add(link);let title=img.alt||link.split('/').pop().replace(/-/g,' ');juegos.push({t:title.substring(0,50),i:src,l:link});});if(juegos.length==0)throw 'vacio';window.todos=juegos;document.getElementById('load').style.display='none';pintar(juegos);}catch(e){document.getElementById('load').innerHTML='Error cargando, recarga la página. '+e;}}function pintar(l){let g=document.getElementById('grid');g.innerHTML='';l.forEach(j=>{g.innerHTML+=`<div class=card><img src="${j.i}" loading=lazy><h3>${j.t}</h3><a class=btn href="${j.l}" target=_blank>Ver</a></div>`;});}function filtrar(){let q=document.getElementById('b').value.toLowerCase();pintar(window.todos.filter(j=>j.t.toLowerCase().includes(q)));}cargar();
</script></body></html>
